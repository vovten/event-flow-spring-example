event-flow:
  enabled: true
  publisher:
    enabled: true
    transactional: true
    retry:
      enabled: true
      max-attempts: 3
    logging:
      enabled: true
      log-levels:
        InternalOrderCreatedEvent: ERROR
        DomainOrderEvent: INFO
    lifecycle:
      enabled: true
      service-name: my-microservice
      store:
        type: db
        table-name: myschema.event_store
        auto-init-schema: true
      cleanup:
        enabled: true
        max-age: 1d
        interval: 30s
    channels:
      - name: internal
        transports:
          - name: local-queue
      - name: external
        transports:
          - name: kafka
            servers: localhost:9092
            topics: test2
            serialization: myJson
      - name: broadcast
        transports:
          - name: kafka
            servers: localhost:9092
            topics: test2
  dispatcher:
    enabled: true
    listener-packages: io.github.vovten.eventflow.example
    deserialization:
      allowed-event-packages:
        - com.custom
    idempotent:
      enabled: true
    logging:
      enabled: true
      log-levels:
        InternalOrderCreatedEvent: ERROR
        DomainOrderEvent: INFO
    lifecycle:
      enabled: true
    transports:
      - name: local-queue
      - name: kafka
        topics: test2
        servers: localhost:9092

